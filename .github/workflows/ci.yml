name: CI

on:
  push:
    branches: [ main, hardening-and-packaging ]
  pull_request:
    branches: [ main, hardening-and-packaging ]

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov build

      - name: Run test suite with coverage
        run: |
          pytest -v --cov=github_companion --cov-report=term-missing

      - name: Build sdist and wheel distributions
        run: |
          python -m build

      - name: Test wheel installation and CLI entrypoint
        run: |
          pip install dist/*.whl
          gc --version
          gc --help
