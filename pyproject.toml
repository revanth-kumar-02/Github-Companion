[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-companion"
version = "0.1.1"
description = "An AI-powered GitHub & Developer CLI for repository management, AI coding agents, and developer workflows."
readme = "README.md"
authors = [
    { name = "Revanth Kumar", email = "revanth.kumar.02@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "rich>=13.0.0",
    "openai>=1.0.0",
]
keywords = ["github", "cli", "ai", "coding-agent", "developer-tools", "git", "ollama", "openrouter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities"
]

[project.urls]
Homepage = "https://github.com/revanth-kumar-02/Github-Companion"
Repository = "https://github.com/revanth-kumar-02/Github-Companion"
"Bug Tracker" = "https://github.com/revanth-kumar-02/Github-Companion/issues"

[project.scripts]
gc = "github_companion.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["github_companion*"]

[tool.setuptools.package-data]
"github_companion.config" = ["*.json", "*.md"]
